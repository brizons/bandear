[package]
name = "bandear-desktop-channels"
version = "0.4.1"
edition = "2024"
description = "The BandEar desktop's Channels and groups screen: its model and its GPUI view."
publish = false

[lib]
name = "bandear_desktop_channels"

[dependencies]
bandear-desktop-console = { path = "../../console" }
bandear-desktop-kit = { path = "../../kit" }
# Wakes the view when the model's own state changes (a box held, an outcome).
futures = "0.3"

[dev-dependencies]
# Opens this screen alone over the simulated desk: `cargo run -p bandear-desktop-channels --example channels_preview`.
bandear-desktop-preview = { path = "../../preview" }
bandear-desktop-console = { path = "../../console", features = ["testing"] }
serde_json = "1"
