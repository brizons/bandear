[package]
name = "bandear-desktop-processing"
version = "0.3.0"
edition = "2024"
description = "The BandEar desktop's Processing screen: its model and its GPUI view."
publish = false

[lib]
name = "bandear_desktop_processing"

[dependencies]
bandear-desktop-console = { path = "../../console" }
bandear-desktop-kit = { path = "../../kit" }

[dev-dependencies]
# Opens this screen alone over the simulated desk: `cargo run -p bandear-desktop-processing --example processing_preview`.
bandear-desktop-preview = { path = "../../preview" }
bandear-desktop-console = { path = "../../console", features = ["testing"] }
