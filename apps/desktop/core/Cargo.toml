[package]
name = "bandear-desktop-core"
version = "0.4.2"
edition = "2021"
description = "The BandEar desktop's backend, whatever draws its window: the engine calls, the session, the event pump, the log file and the app's folders."
publish = false

[lib]
name = "bandear_desktop_core"

[features]
# Lets a shell's own tests drive a desk state with no engine: they mark a local mix and read what
# the session keeps, with savers that write only when flushed. Never on in a build.
test-support = []

[dependencies]
dirs = "7"
personal-monitoring = { path = "../../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
