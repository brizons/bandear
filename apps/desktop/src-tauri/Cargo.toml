[package]
name = "bandear-desktop-tauri"
version = "0.3.0"
edition = "2021"
description = "The Tauri shell of the BandEar desktop mixing console: the web UI's window over the desktop core."
publish = false

[lib]
name = "bandear_desktop_tauri"
crate-type = ["rlib"]

[[bin]]
name = "bandear-desktop-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bandear-desktop-core = { path = "../core" }
personal-monitoring = { path = "../../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
# The run-event test marks a local mix and reads what the session keeps, as the core's own tests do.
bandear-desktop-core = { path = "../core", features = ["test-support"] }
