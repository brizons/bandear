[workspace]
members = [
    "apps/server",
    "apps/desktop/core",
    "apps/desktop/console",
    "apps/desktop/kit",
    "apps/desktop/screens/mix",
    "apps/desktop/screens/record",
    "apps/desktop/screens/channels",
    "apps/desktop/screens/processing",
    "apps/desktop/screens/effects",
    "apps/desktop/screens/network",
    "apps/desktop/src-tauri",
]
exclude = ["vendor/cpal"]
resolver = "2"

# cpal is vendored with one patch: its ASIO host opens a single driver by name instead of loading every
# installed driver to list them. See "TA (ASIO safety port)" in odd/tasks/desktop-dsp.md for what
# changed and when to drop it.
[patch.crates-io]
cpal = { path = "vendor/cpal" }
