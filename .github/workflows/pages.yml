# Builds the website in site/ (Astro, static output) and publishes it to GitHub Pages.
#
# Every run installs the locked dependencies, builds site/dist/ and runs the tests, which check
# the page scripts and the built pages. Pull requests that touch the site stop there; on main
# (or by hand from the Actions tab) site/dist/ becomes the Pages artifact and is deployed.
# Pages must use "GitHub Actions" as its source (Settings → Pages); the custom domain
# bandear.com is set there as well, since an Actions-deployed site ignores a CNAME file.

name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Runs on main (and by hand) share one group, so each build and deploy finishes before the next
# starts and the site goes live in push order; a waiting run is replaced by a newer one, never
# run out of order. Each pull request has a group of its own, where a new push cancels the check
# still running.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the locked dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Test the page scripts and the built pages
        run: npm test

      - name: List the published files
        run: find dist -type f | sort

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
