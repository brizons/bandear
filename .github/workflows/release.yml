name: Release

# Builds the desktop app for Windows, macOS and Linux and the Android app, and puts them in a draft
# GitHub Release. Runs by hand from the Actions tab, or when a tag such as v0.1.0 is pushed.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The GPUI app draws through X11 or Wayland and the engine captures through ALSA.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev

      # rust-toolchain.toml pins the compiler; this installs it with the target to build for.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # asio-sys (the engine's ASIO input on Windows) downloads the ASIO SDK and unpacks it with
      # Windows PowerShell's Expand-Archive, which fails on the windows-2025-vs2026 image of
      # 2026-11-16 ("Cannot find an overload for "ExtractToDirectory" and the argument count: "3""),
      # leaving no headers to build with. So the SDK is unpacked here, with PowerShell 7, and
      # CPAL_ASIO_DIR points asio-sys at it.
      - name: ASIO SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "asio_sdk.zip"
          $dest = Join-Path $env:RUNNER_TEMP "asio_sdk"
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
          $sdk = Get-ChildItem -Path $dest -Directory | Where-Object { $_.Name -like "asio*" } | Select-Object -First 1
          if (-not $sdk -or -not (Test-Path (Join-Path $sdk.FullName "host/asiodrivers.h"))) {
            throw "The ASIO SDK at $dest has no host/asiodrivers.h"
          }
          "CPAL_ASIO_DIR=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: cargo build --release --locked -p bandear-desktop --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: apps/desktop/app/package.sh ${{ matrix.target }}

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/app/Cargo.toml | head -n 1)
          # Each platform's job may be first; the others find the draft already there.
          gh release create "v${version}" --draft --title "BandEar v${version}" \
            --repo "${{ github.repository }}" --notes "The Windows build is not signed yet: choose \"More info\" then \"Run anyway\" the first time. The macOS app is ad-hoc signed but not notarized: open it once, then go to System Settings > Privacy & Security and choose \"Open Anyway\"." \
            || true
          gh release upload "v${version}" dist/* --clobber --repo "${{ github.repository }}"

  android:
    name: Android
    needs: desktop
    # Still builds the APK when one desktop platform failed; the release exists once any of them ran.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # The app links the phones' shared Rust core: the Gradle build compiles it with cargo-ndk for
      # these three ABIs and generates its Kotlin bindings from a build for the runner itself.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          key: Android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # The NDK the app's build.gradle.kts pins with ndkVersion; cargo-ndk builds with it.
      - name: Install the Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"'

      - name: Build the APK
        run: gradle -p apps/android :app:assembleDebug --no-daemon

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandear-android
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach the APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/app/Cargo.toml | head -n 1)
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "BandEar_${version}_android.apk"
          gh release upload "v${version}" "BandEar_${version}_android.apk" --clobber --repo "${{ github.repository }}"
